name: Deploy Fullstack (Next.js + Quarkus) to EC2

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    #####################################################
    # FRONTEND (Next.js)
    #####################################################
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Frontend Dependencies
      run: npm install
      working-directory: ./frontend

    - name: Build Frontend
      run: npm run build
      working-directory: ./frontend

    - name: Export Static Frontend
      run: npm run export
      working-directory: ./frontend

    #####################################################
    # BACKEND (Quarkus)
    #####################################################
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: "17"

    - name: Build Quarkus Backend
      run: mvn package -DskipTests
      working-directory: ./backend

    #####################################################
    # DEPLOY STATIC SITE + QUARKUS SERVICE
    #####################################################
    - name: Add EC2 to Known Hosts
      run: ssh-keyscan -H 3.110.154.138 >> ~/.ssh/known_hosts

    - name: Deploy Frontend (Static Next.js)
      run: |
        scp -i /home/ubuntu/.ssh/id_ed25519 -r \
          ./frontend/out/* \
          ubuntu@3.110.154.138:/var/www/html/

    - name: Deploy Backend (Quarkus)
      run: |
        scp -i /home/ubuntu/.ssh/id_ed25519 -r \
          ./backend/target/quarkus-app \
          ubuntu@3.110.154.138:/opt/backend/

    - name: Restart Backend + Reload NGINX
      run: |
        ssh -i /home/ubuntu/.ssh/id_ed25519 ubuntu@3.110.154.138 "
          sudo systemctl restart backend || true
          sudo systemctl reload nginx
        "

    - name: Print URLs
      run: |
        echo "Frontend: http://3.110.154.138/"
        echo "Backend:  http://3.110.154.138:8080/hello"
