name: Deploy Static Files to EC2

on:
  push:
    branches: ["main"]

jobs:
  deploy-static:
    runs-on: self-hosted

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Prepare Static Files
      run: |
        rm -rf deploy
        mkdir deploy

        cp index.html deploy/ || true
        cp onboarding.js deploy/ || true
        cp test.js deploy/ || true

        echo "Static files prepared:"
        ls -l deploy

    - name: Add EC2 Host to Known Hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H 3.110.154.138 >> ~/.ssh/known_hosts

    - name: Copy Files to EC2 (Self-Hosted Runner Using Local Key)
      run: |
        scp \
        -i /home/your-runner-user/.ssh/id_ed25519 \
        -o StrictHostKeyChecking=no \
        deploy/* \
        ubuntu@3.110.154.138:/var/www/html/

    - name: Print Website URL
      run: echo "Website Live at: http://3.110.154.138/"
