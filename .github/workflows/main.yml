name: CI Pipeline (Strict NO-Docker)

on:
  push:
    branches: [develop, main]
    tags:
      - 'v*'
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

env:
  NODE_VERSION: '18.x'
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
# =========================
# 1. Frontend CI
# =========================
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: |
          test -f package.json || (echo "ERROR: No package.json in frontend" && exit 1)
          npm install --no-audit --no-fund

      - name: Run frontend linter
        working-directory: ./frontend
        run: npm run lint

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm test

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            .next/
            frontend/.next/
            frontend/out/
            frontend/build/
          if-no-files-found: error
          retention-days: 14


# =========================
# 2. Backend CI
# =========================
  backend-ci:
    name: Backend CI (Java Quarkus)
    runs-on: ubuntu-latest
    needs: frontend-ci
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Build and test backend
        working-directory: ./backend
        run: mvn -B clean verify

      - name: Package backend
        working-directory: ./backend
        run: mvn -B package

      - name: Upload backend JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 14


# =========================
# 3. Package Artifacts
# =========================
  package-artifacts:
    name: Package Release Artifacts
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci]
    if: |
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Set Auto Version
        id: version
        run: echo "version=${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT

      - name: Set Environment
        id: env
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "env=staging" >> $GITHUB_OUTPUT
          else
            echo "env=production" >> $GITHUB_OUTPUT
          fi

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: release/frontend

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: release/backend

      - name: Verify artifacts exist
        run: |
          ls -la release/frontend || exit 1
          ls -la release/backend  || exit 1

      - name: Create Release Bundle
        id: bundle
        run: |
          ENV=${{ steps.env.outputs.env }}
          VER=${{ steps.version.outputs.version }}
          zip -r multiplus-${ENV}-${VER}.zip release/
          echo "bundle=multiplus-${ENV}-${VER}.zip" >> $GITHUB_OUTPUT

      - name: Generate SHA256
        run: |
          sha256sum ${{ steps.bundle.outputs.bundle }} \
          > ${{ steps.bundle.outputs.bundle }}.sha256

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: multiplus-release-${{ steps.env.outputs.env }}
          path: |
            *.zip
            *.sha256
          retention-days: 30


# =========================
# 4. Deploy to STAGING (AUTO from main)
# =========================
  deploy-staging:
    name: Deploy to STAGING
    runs-on: ubuntu-latest
    needs: package-artifacts
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download STAGING bundle
        uses: actions/download-artifact@v4
        with:
          name: multiplus-release-staging

      - name: Deploy to Staging Server
        run: |
          echo "✅ Deploying to STAGING server"
          echo "➡ Here we will add real SSH deployment next"


# =========================
# 5. Deploy to PRODUCTION (ONLY from v* tag)
# =========================
  deploy-production:
    name: Deploy to PRODUCTION
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download PRODUCTION bundle
        uses: actions/download-artifact@v4
        with:
          name: multiplus-release-production

      - name: Deploy to Production Server
        run: |
          echo "✅ Deploying to PRODUCTION server"
          echo "➡ Here we will add real SSH deployment next"


# =========================
# 6. CI Status Summary
# =========================
  ci-status:
    name: CI Status Summary
    runs-on: ubuntu-latest
    needs:
      - frontend-ci
      - backend-ci
      - package-artifacts
      - deploy-staging
      - deploy-production
    if: always()

    steps:
      - name: Summarize CI
        run: |
          echo "Frontend:   ${{ needs.frontend-ci.result }}"
          echo "Backend:    ${{ needs.backend-ci.result }}"
          echo "Packaging:  ${{ needs.package-artifacts.result }}"
          echo "Staging:    ${{ needs.deploy-staging.result }}"
          echo "Production: ${{ needs.deploy-production.result }}"
          if [ "${{ needs.frontend-ci.result }}" = "success" ] && \
             [ "${{ needs.backend-ci.result }}" = "success" ] && \
             [ "${{ needs.package-artifacts.result }}" = "success" ]; then
            exit 0
          else
            exit 1
          fi


# =========================
# 7. Failure Notification
# =========================
  notify-on-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: ci-status
    if: failure()
    steps:
      - name: Send Failure Notification
        run: |
          echo "❌ CI/CD Pipeline Failed for ${{ github.repository }}"
