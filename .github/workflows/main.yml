name: CI Pipeline (Strict NO-Docker)

on:
  push:
    branches: [develop, main]
    tags:
      - 'v*'
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

env:
  NODE_VERSION: '18.x'
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
# =========================
# 1. Frontend CI
# =========================
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: |
          test -f package.json || (echo "ERROR: No package.json in frontend" && exit 1)
          npm install --no-audit --no-fund

      - name: Run frontend linter
        working-directory: ./frontend
        run: npm run lint

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm test

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next/
          retention-days: 14


# =========================
# 2. Backend CI (Java / Quarkus)
# =========================
  backend-ci:
    name: Backend CI (Java Quarkus)
    runs-on: ubuntu-latest
    needs: frontend-ci
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Build and test backend
        working-directory: ./backend
        run: mvn -B clean verify

      - name: Package backend
        working-directory: ./backend
        run: mvn -B package

      - name: Upload backend JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 14


# =========================
# 3. Package Artifacts (STAGING / PROD)
# =========================
  package-artifacts:
    name: Package Release Artifacts
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci]
    if: |
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Read Version
        id: version
        run: |
          test -f VERSION || (echo "VERSION file missing" && exit 1)
          echo "version=$(cat VERSION | tr -d ' \n')" >> $GITHUB_OUTPUT

      - name: Set Environment
        id: env
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "env=staging" >> $GITHUB_OUTPUT
          else
            echo "env=production" >> $GITHUB_OUTPUT
          fi

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: release/frontend

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: release/backend

      - name: Create Release Bundle
        id: bundle
        run: |
          ENV=${{ steps.env.outputs.env }}
          VER=${{ steps.version.outputs.version }}
          zip -r multiplus-${ENV}-${VER}.zip release/
          echo "bundle=multiplus-${ENV}-${VER}.zip" >> $GITHUB_OUTPUT

      - name: Generate SHA256
        run: |
          sha256sum ${{ steps.bundle.outputs.bundle }} \
          > ${{ steps.bundle.outputs.bundle }}.sha256

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: multiplus-release-${{ steps.env.outputs.env }}
          path: |
            *.zip
            *.sha256
          retention-days: 30


# =========================
# 4. CI Status Summary
# =========================
  ci-status:
    name: CI Status Summary
    runs-on: ubuntu-latest
    needs:
      - frontend-ci
      - backend-ci
      - package-artifacts
    if: always()

    steps:
      - name: Summarize CI
        run: |
          echo "Frontend:  ${{ needs.frontend-ci.result }}"
          echo "Backend:   ${{ needs.backend-ci.result }}"
          echo "Artifacts: ${{ needs.package-artifacts.result }}"
          if [ "${{ needs.frontend-ci.result }}" = "success" ] && \
             [ "${{ needs.backend-ci.result }}" = "success" ] && \
             [ "${{ needs.package-artifacts.result }}" = "success" ]; then
            exit 0
          else
            exit 1
          fi


# =========================
# 5. Failure Notification
# =========================
  notify-on-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: ci-status
    if: failure()
    steps:
      - name: Send Failure Notification
        run: |
          echo "CI Failed for ${{ github.repository }}"
