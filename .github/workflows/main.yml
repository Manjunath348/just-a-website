name: Deploy Fullstack (Next.js + Quarkus) to EC2

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    #####################################################
    # FRONTEND (Next.js)
    #####################################################
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Frontend Dependencies
      run: npm install
      working-directory: ./frontend

    - name: Build Frontend
      run: npm run build
      working-directory: ./frontend

    - name: Export Static Frontend
      run: npm run export
      working-directory: ./frontend

    #####################################################
    # BACKEND (Quarkus)
    #####################################################
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: "17"

    - name: Build Quarkus Backend
      run: mvn package -DskipTests
      working-directory: ./backend
