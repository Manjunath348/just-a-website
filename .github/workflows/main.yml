name: Deploy Static Files to EC2

on:
  push:
    branches: ["main"]

jobs:
  deploy-static:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Prepare Static Files
      run: |
        rm -rf deploy
        mkdir deploy

        cp index.html deploy/ || true
        cp onboarding.js deploy/ || true
        cp test.js deploy/ || true

        echo "Static files prepared:"
        ls -l deploy

    - name: Copy Files to EC2 using SCP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: 3.110.154.138
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "deploy/*"
        target: "/var/www/html"

    - name: Print Website URL
      run: echo "Website Live at: http://3.110.154.138/"
