name: CI Pipeline (Strict NO-Docker)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  NODE_VERSION: '18.x'
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build Frontend
        working-directory: ./frontend
        run: |
          test -f package.json || (echo "ERROR: No package.json in frontend" && exit 1)
          npm install --no-audit --no-fund
          npm run lint
          npm test
          npm run build

      - name: Debug frontend build output
        working-directory: ./frontend
        run: |
          echo "PWD: $(pwd)"
          echo ">>> Listing frontend folder"
          ls -lah
          echo ">>> Listing .next folder"
          ls -lah .next || echo ".next not found"

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        working-directory: ./frontend
        with:
          name: frontend-build
          path: .next/
          if-no-files-found: error
          retention-days: 14

  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    needs: frontend-ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build backend
        working-directory: ./backend
        run: mvn -B clean verify package

      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 14

  package-artifacts:
    name: Package Release Artifacts
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci]
    if: |
      github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Set Auto Version
        id: version
        run: echo "version=${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT
      - name: Set Environment
        id: env
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "env=staging" >> $GITHUB_OUTPUT
          else
            echo "env=production" >> $GITHUB_OUTPUT
          fi

      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: release/frontend
      - uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: release/backend

      - name: Create Release Bundle
        id: bundle
        run: |
          ENV=${{ steps.env.outputs.env }}
          VER=${{ steps.version.outputs.version }}
          mkdir -p release/${ENV}
          mv release/frontend release/${ENV}/frontend
          mv release/backend release/${ENV}/backend
          zip -r multiplus-${ENV}-${VER}.zip release/${ENV}
          echo "bundle=multiplus-${ENV}-${VER}.zip" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: multiplus-release-${{ steps.env.outputs.env }}
          path: multiplus-${{ steps.env.outputs.env}.zip
          retention-days: 30

  # (Deploy jobs remain same — omitted here for brevity)
