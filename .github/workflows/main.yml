name: CI Pipeline (Strict NO-Docker)

on:
  push:
    branches: [develop, main]
    tags:
      - 'v*'
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

env:
  NODE_VERSION: '18.x'
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  FRONTEND_PATH: /var/www/frontend
  BACKEND_PATH: /opt/backend
  BACKEND_SERVICE: backend.service

jobs:
# =========================
# 1. Frontend CI
# =========================
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build Frontend
        working-directory: ./frontend
        run: |
          test -f package.json || exit 1
          npm install --no-audit --no-fund
          npm run lint
          npm test
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            .next/
            frontend/.next/
            frontend/out/
          if-no-files-found: error
          retention-days: 14


# =========================
# 2. Backend CI
# =========================
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    needs: frontend-ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build Backend
        working-directory: ./backend
        run: |
          mvn -B clean verify
          mvn -B package

      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 14


# =========================
# 3. Package Artifacts
# =========================
  package-artifacts:
    name: Package Release Artifacts
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci]
    if: |
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Set Auto Version
        id: version
        run: echo "version=${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT

      - name: Set Environment
        id: env
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "env=staging" >> $GITHUB_OUTPUT
          else
            echo "env=production" >> $GITHUB_OUTPUT
          fi

      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: release/frontend

      - uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: release/backend

      - name: Create Release Bundle
        id: bundle
        run: |
          ENV=${{ steps.env.outputs.env }}
          VER=${{ steps.version.outputs.version }}
          mkdir -p release/${ENV}
          mv release/frontend release/${ENV}/frontend
          mv release/backend release/${ENV}/backend
          zip -r multiplus-${ENV}-${VER}.zip release/
          echo "bundle=multiplus-${ENV}-${VER}.zip" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: multiplus-release-${{ steps.env.outputs.env }}
          path: |
            *.zip
          retention-days: 30


# =========================
# 4. Deploy to STAGING (IntechDC I4)
# =========================
  deploy-staging:
    name: Deploy to STAGING (IntechDC)
    runs-on: ubuntu-latest
    needs: package-artifacts
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: multiplus-release-staging

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Staging Server
        run: |
          unzip multiplus-staging-*.zip
          scp -r release/* ubuntu@${{ secrets.STAGING_HOST }}:/tmp/multiplus/

          ssh ubuntu@${{ secrets.STAGING_HOST }} << 'EOF'
            sudo mkdir -p ${{ env.FRONTEND_PATH }}
            sudo mkdir -p ${{ env.BACKEND_PATH }}

            sudo cp -r /tmp/multiplus/frontend/* ${{ env.FRONTEND_PATH }}/
            sudo cp /tmp/multiplus/backend/*.jar ${{ env.BACKEND_PATH }}/app.jar

            sudo systemctl restart ${{ env.BACKEND_SERVICE }}
          EOF


# =========================
# 5. Deploy to PRODUCTION (AWS EC2 t3.medium)
# =========================
  deploy-production:
    name: Deploy to PRODUCTION (AWS EC2)
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: multiplus-release-production

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.PROD_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Production Server
        run: |
          unzip multiplus-production-*.zip
          scp -r release/* ubuntu@${{ secrets.PROD_HOST }}:/tmp/multiplus/

          ssh ubuntu@${{ secrets.PROD_HOST }} << 'EOF'
            sudo mkdir -p ${{ env.FRONTEND_PATH }}
            sudo mkdir -p ${{ env.BACKEND_PATH }}

            sudo cp -r /tmp/multiplus/frontend/* ${{ env.FRONTEND_PATH }}/
            sudo cp /tmp/multiplus/backend/*.jar ${{ env.BACKEND_PATH }}/app.jar

            sudo systemctl restart ${{ env.BACKEND_SERVICE }}
          EOF


# =========================
# 6. CI Status Summary
# =========================
  ci-status:
    name: CI Status Summary
    runs-on: ubuntu-latest
    needs:
      - frontend-ci
      - backend-ci
      - package-artifacts
      - deploy-staging
      - deploy-production
    if: always()

    steps:
      - run: |
          echo "Frontend:   ${{ needs.frontend-ci.result }}"
          echo "Backend:    ${{ needs.backend-ci.result }}"
          echo "Packaging:  ${{ needs.package-artifacts.result }}"
          echo "Staging:    ${{ needs.deploy-staging.result }}"
          echo "Production: ${{ needs.deploy-production.result }}"
