name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '18.x'
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  # Frontend Build and Test
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
          else
            echo "No package.json found, skipping npm install"
          fi

      - name: Run frontend linter
        working-directory: ./frontend
        run: |
          if [ -f package.json ] && npm run lint --if-present; then
            echo "Linting completed"
          else
            echo "No linting script found, skipping"
          fi
        continue-on-error: true

      - name: Run frontend tests
        working-directory: ./frontend
        run: |
          if [ -f package.json ] && npm test --if-present; then
            echo "Tests completed"
          else
            echo "No test script found, skipping"
          fi
        continue-on-error: true

      - name: Build frontend
        working-directory: ./frontend
        run: |
          if [ -f package.json ]; then
            npm run build --if-present || echo "No build script, skipping"
          else
            echo "No package.json found, using static files"
          fi

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            frontend/build/
            frontend/dist/
            frontend/*.html
            frontend/*.js
            frontend/*.css
          retention-days: 7
          if-no-files-found: warn

  # Backend Build and Test (Java Quarkus)
  backend-ci:
    name: Backend CI (Java Quarkus)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Build backend (skip tests)
        working-directory: ./backend
        run: mvn clean install -DskipTests

      - name: Run Quarkus tests
        working-directory: ./backend
        run: mvn test
        continue-on-error: true

      - name: Package Quarkus application
        working-directory: ./backend
        run: mvn package

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/target/
          retention-days: 7

  # Docker Build and Push
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: backend/target/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKER_USERNAME }}/multiplus
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Frontend Docker image
        if: hashFiles('frontend/Dockerfile') != ''
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ secrets.DOCKER_USERNAME }}/multiplus-frontend:${{ github.sha }},${{ secrets.DOCKER_USERNAME }}/multiplus-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Backend Docker image
        if: hashFiles('backend/Dockerfile') != ''
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ secrets.DOCKER_USERNAME }}/multiplus-backend:${{ github.sha }},${{ secrets.DOCKER_USERNAME }}/multiplus-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push using docker-compose
        if: hashFiles('docker-compose.yml') != '' && hashFiles('frontend/Dockerfile') == '' && hashFiles('backend/Dockerfile') == ''
        run: |
          docker-compose build
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            docker-compose push || echo "No push configured in docker-compose"
          fi

  

  # Security Scanning
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  # Code Quality Check
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

  # Final Status Check
  ci-status:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci, docker-build]
    if: always()
    
    steps:
      - name: Check CI Status
        run: |
          if [ "${{ needs.frontend-ci.result }}" == "success" ] && \
             [ "${{ needs.backend-ci.result }}" == "success" ] && \
             [ "${{ needs.docker-build.result }}" == "success" ]; then
            echo "✅ All CI checks passed!"
            exit 0
          else
            echo "❌ Some CI checks failed"
            echo "Frontend: ${{ needs.frontend-ci.result }}"
            echo "Backend (Java Quarkus): ${{ needs.backend-ci.result }}"
            echo "Docker: ${{ needs.docker-build.result }}"
            exit 1
          fi

