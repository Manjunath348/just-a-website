name: Build Fullstack (Next.js + Quarkus)

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    #####################################################
    # CHECKOUT
    #####################################################
    - name: Checkout Code
      uses: actions/checkout@v4

    #####################################################
    # FRONTEND (Next.js)
    #####################################################
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Frontend Dependencies
      run: npm install
      working-directory: ./frontend

    - name: Build Frontend
      run: npm run build
      working-directory: ./frontend

    # Optional: Export if you're using static export (Next.js Out folder)
    - name: Export Static Frontend
      if: success()
      run: npm run export
      working-directory: ./frontend

    #####################################################
    # BACKEND (Quarkus)
    #####################################################
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: "17"

    - name: Build Quarkus Backend
      run: mvn package -DskipTests
      working-directory: ./backend

    #####################################################
    # ARTIFACT STORAGE
    #####################################################
    - name: Upload Frontend Artifact
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: ./frontend/out

    - name: Upload Backend Artifact
      uses: actions/upload-artifact@v4
      with:
        name: backend-build
        path: ./backend/target/*.jar
