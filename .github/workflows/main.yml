  name: Deploy Static Site to EC2 (Self-Hosted Runner)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Prepare Static Files
      run: |
        rm -rf deploy
        mkdir deploy
        cp index.html deploy/ || true
        cp onboarding.js deploy/ || true
        cp test.js deploy/ || true
        ls -l deploy

    - name: Add EC2 to Known Hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H 15.206.117.5 >> ~/.ssh/known_hosts

   - name: Reload NGINX on EC2
      run: |
        ssh \
          -i /home/ubuntu/.ssh/id_ed25519 \
          -o StrictHostKeyChecking=no \
          ubuntu@3.110.154.138 \
          "sudo systemctl reload nginx"

    - name: Print URL
      run: echo "Site Live at:http://3.110.154.138/"
